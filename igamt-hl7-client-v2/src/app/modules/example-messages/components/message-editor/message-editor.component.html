<div class="message-editor">
    <div style="display: flex; width: 100%; height: 500px; gap: 8px;">

        <div style="width: 400px; border: 1px solid lightgray; display: flex; flex-direction: column;">
            <div style="height: 40px; border-bottom: 1px solid lightgray; display: flex; align-items: center; justify-content: center; box-shadow: 0px 3px 5px -2px rgba(0, 0, 0, 0.75); z-index: 1;">
                Message Tree
            </div>
            <div style="flex: 1; background-color: rgb(246, 246, 246); position: relative; overflow: hidden;">
                <div *ngIf="!loading && staleMessageTree" class="stale-overlay">
                    <span style="text-align: center;">Save or Create message to see parsed content.</span>
                </div>
                <div *ngIf="loading" style="height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; position: absolute;">
                    <mat-spinner *ngIf="loading" class="verification-progress" diameter="45"></mat-spinner>
                </div>
                <div *ngIf="!loading && parsed" style="height: 100%; width: 100%; overflow: scroll; padding: 15px;">
                    <tree-root #treeroot [nodes]="parsed.children" [options]="options">
                        <ng-template #treeNodeTemplate let-index="index" let-node>
                            <div [contextMenu]="elementContextMenu">
                                <span [ngClass]="{ 'selected': selected && node.data.positionalPath === selected.positionalPath }" (click)="highlight(node.data)" style="white-space: nowrap; color: black;">
                                    <app-entity-bagde [type]="node.data.type" ></app-entity-bagde>
                                    {{ node.data.hl7Path }}
                                    <span *ngIf="node.data.type !== 'GROUP'">- {{ node.data.name }}</span>
                                </span>
                                <context-menu #elementContextMenu>
                                    <ng-template (execute)="createSnippet(node.data)" contextMenuItem [enabled]="!staleMessageTree">
                                        <i class="fa fa-plus"></i> Create Snippet
                                    </ng-template>
                                </context-menu>
                            </div>
                        </ng-template>
                    </tree-root>
                </div>
            </div>
        </div>

        <div style="flex: 1; width: 100%; overflow: hidden; border: 1px solid lightgray;">
            <ngx-codemirror
                #codemirror
                [(ngModel)]="message"
                (ngModelChange)="messageChange()"
                id="message"
                name="message"
                [options]="messageEditorOptions"
            ></ngx-codemirror>
        </div>
    </div>

    <div style="height: 500px;" *ngIf="!(viewOnly$ | async)" [froalaEditor]="froalaConfig$ | async" [(ngModel)]="narrative" (ngModelChange)="change()"></div>
</div>

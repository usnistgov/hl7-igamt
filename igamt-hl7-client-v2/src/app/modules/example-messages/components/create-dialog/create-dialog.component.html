<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
<div class="form-group">
  <label>Name</label>
  <input class="form-control" type="text" [(ngModel)]="name" />
</div>

</mat-dialog-content>
<mat-dialog-actions style="justify-content: flex-end;">
  <button [mat-dialog-close]="" class="btn btn-sm btn-secondary" style="margin-right: 5px;">Cancel</button>
  <button [mat-dialog-close]="{ name: name }" class="btn btn-sm btn-success">Done</button>
</mat-dialog-actions>
